name: tiktok-connect
# One-time: exchange the TikTok authorization code for a refresh token and store it as a repo secret.
# Run from the Actions tab > tiktok-connect > Run workflow, pasting the "code" from the redirect URL.
on:
  workflow_dispatch:
    inputs:
      code: { description: "The code= value from the address bar after approving in TikTok", required: true }
      secret_name: { description: "Secret to store the refresh token in", default: "TIKTOK_REFRESH_TOKEN_HOWITWORKS" }
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: exchange
        env:
          CODE: "${{ inputs.code }}"
          NAME: "${{ inputs.secret_name }}"
          KEY: "${{ secrets.TIKTOK_CLIENT_KEY }}"
          SEC: "${{ secrets.TIKTOK_CLIENT_SECRET }}"
          GH_TOKEN: "${{ secrets.GH_SECRETS_PAT }}"
          REDIRECT: "https://github.com/Royharel2233/ig-media"
        run: |
          echo "::add-mask::$CODE"
          [ -n "$GH_TOKEN" ] || { echo "::error::GH_SECRETS_PAT secret is missing"; exit 1; }
          CODE=$(python3 -c "import urllib.parse,os;print(urllib.parse.unquote(os.environ['CODE']))")
          RESP=$(curl -s -X POST https://open.tiktokapis.com/v2/oauth/token/ -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_key=$KEY" --data-urlencode "client_secret=$SEC" --data-urlencode "code=$CODE" \
            --data-urlencode "grant_type=authorization_code" --data-urlencode "redirect_uri=$REDIRECT")
          RT=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('refresh_token',''))")
          if [ -z "$RT" ]; then echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print('::error::',d.get('error'),d.get('error_description'))"; exit 1; fi
          echo "::add-mask::$RT"
          gh secret set "$NAME" --body "$RT" -R "$GITHUB_REPOSITORY"
          echo "TikTok connected; refresh token stored in $NAME"
