name: publish
# Stage B: render and publish every new jobs/<page>/<slot>/job.json
on:
  push:
    paths: ["jobs/**/job.json", "ops/publish-now.txt"]   # editing ops/publish-now.txt retries unfinished jobs
  workflow_dispatch:
concurrency: { group: publish, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        # Latest main, not the triggering commit: a queued run must see result.json files that
        # earlier runs pushed while it waited, or it re-publishes their posts (double posts 24-25.10).
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -q libraqm0 libfribidi0 && pip install -q pillow==11.3.0
      - run: git config user.name "ig-media-bot"; git config user.email "bot@users.noreply.github.com"
      - run: python engine/publish.py
        env:
          IG_TOKEN_GLOBALNEWS: "${{ secrets.IG_TOKEN_GLOBALNEWS }}"
          IG_TOKEN_1PAPER: "${{ secrets.IG_TOKEN_1PAPER }}"
          IG_TOKEN_HOWITWORKS: "${{ secrets.IG_TOKEN_HOWITWORKS }}"
          THREADS_TOKEN_GLOBALNEWS: "${{ secrets.THREADS_TOKEN_GLOBALNEWS }}"
